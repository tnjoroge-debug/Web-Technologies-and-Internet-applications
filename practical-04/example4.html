<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>

<body>

    <h1>My Favourite Programming Languages</h1>

    <h2>Unordered List</h2>

    <ul>
        <li>Python</li>
        <li>Java</li>
        <li>C++</li>
        <li>JavaScript</li>
    </ul>

    <h2>Ordered List</h2>

    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Python</li>
    </ol>

</body>
</html>
